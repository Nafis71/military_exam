name: military_exam
description: "Military Examination Application - BYOD secure exam platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.8.0+1
  logger: ^2.5.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  airplane_mode_checker: ^3.0.0
  connectivity_plus: ^7.2.0
  permission_handler: ^12.0.0+1
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  equatable: ^2.0.7
  intl: ^0.20.2
  image: ^4.5.4
  screen_security: ^1.1.0
  app_settings: ^7.0.0
  overlay_support: ^2.1.0
  flutter_edge_detection:
    path: packages/flutter_edge_detection
  path: ^1.9.1
  advanced_root_detection:
    path: packages/advanced_root_detection
  lottie: ^3.3.1
  device_info_plus: ^11.3.3
  ai_barcode_scanner: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg/
    - assets/fonts/
    - assets/lotties/
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Light.ttf
          weight: 300
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700