name: military_exam
description: "Military Examination Application - BYOD secure exam platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.8.0+1
  logger: ^2.5.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  airplane_mode_checker: ^3.0.0
  connectivity_plus: ^7.2.0
  root_checker_plus: 1.0.0
  pretty_dio_logger: ^1.4.0
  camera: ^0.11.1
  permission_handler: ^12.0.0+1
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  uuid: ^4.5.1
  equatable: ^2.0.7
  intl: ^0.20.2
  image: ^4.5.4
  screen_security: ^1.1.0
  app_settings: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/