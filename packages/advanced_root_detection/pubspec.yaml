name: advanced_root_detection
description: "Flutter RASP plugin for Android & iOS: detects rooted/jailbroken devices, Frida/Xposed hooking, emulators, debuggers, and app tampering with NDK-level detection."
version: 0.0.4+1
homepage: https://github.com/deepak0759/advanced_root_detection
repository: https://github.com/deepak0759/advanced_root_detection
issue_tracker: https://github.com/deepak0759/advanced_root_detection/issues

topics:
  - security
  - rasp
  - root-detection
  - jailbreak
  - anti-tamper

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.advanced_root_detection
        pluginClass: AdvanceRootDetectionPlugin
      ios:
        pluginClass: AdvanceRootDetectionPlugin
